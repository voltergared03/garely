# LiveKit Egress config. Copy to egress.yaml and fill in real values.
# redis MUST be the same instance LiveKit server uses (see livekit.yaml).
redis:
  address: eam-meet-redis:6379
  password: your-redis-password
api_key: EAM_MEET_KEY
api_secret: your-livekit-api-secret-hex   # must match livekit.yaml + .env
ws_url: ws://livekit:7880
log_level: info

# These are DECLARATIONS, and LiveKit holds a job to them: a handler that outgrows
# the cost it declared is killed mid-recording with "CPU exhausted". Under-declaring
# to fit a job into a small cap therefore does not make it cheaper — it makes it die.
#
# On egress ≤ v1.12.0 room-composite ran a headless Chrome even with audioOnly (the
# flag skipped the video ENCODE, not the browser), ~1.9-2.75 cores in practice.
# Declaring 1.0 for it is what killed a 52-minute recording four minutes in on
# 2026-08-26. v1.13.0 (pinned in docker-compose.yml) removed the browser from the
# audio-only path — see audio_room_composite_cpu_cost below.
#
# Keep `cpus:` for the egress service in docker-compose.yml ABOVE this number, or the
# job is never admitted at all ("no response from servers"). 2.5 here needs 3 there.
cpu_cost:
  # Video room composite (the legacy grid MP4): headless Chrome, ~1.9 cores measured.
  room_composite_cpu_cost: 2.5
  # Audio-only room composite: since egress v1.13.0 this runs through the SDK with no
  # browser at all (condition: audio_only, no layout, no custom_base_url — exactly what
  # lib/egress.ts sends). Measured on v1.12.0 with Chrome it was 2.75 cores and got
  # killed; the SDK path sits near 1.
  audio_room_composite_cpu_cost: 1.0
  web_cpu_cost: 2.5
  track_composite_cpu_cost: 0.7
  # Track egress is a passthrough copy — no transcode, no browser.
  track_cpu_cost: 0.3
